<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UI demo: portraits and moods</title>
  <link rel="stylesheet" href="./base.css">
  <style>
    /* Demo-only layout. Uses palette names from base.css, no new colors. */
    .demo { padding: 24px 32px; background: var(--bg); overflow: auto; }
    .demo h1 { font-size: var(--body); margin-bottom: 8px; }
    .demo-note { font-size: var(--small); color: var(--muted); margin-bottom: 16px; }
    .demo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .demo-tile { border: 4px solid var(--frame-edge); padding: 8px; font-size: var(--small); }
    .demo-tile.demo-fallback { border-color: var(--accent); grid-column: span 2; }
    .demo-faces { display: flex; gap: 12px; margin: 8px 0; }
    .demo-face { display: flex; flex-direction: column; gap: 4px; }
    .demo-source { font-size: 8px; color: var(--muted); }
    .demo-buttons { margin-top: 12px; }
    .demo-buttons .btn { font-size: var(--small); padding: 8px 12px; }

    /* See-through text boxes over a bright and a busy background (palette colors only). */
    .demo-stages { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .demo-stage { position: relative; height: 440px; overflow: hidden; border: 4px solid var(--frame-edge); }
    .demo-stage-label {
      position: absolute; top: 8px; left: 8px; z-index: 40;
      padding: 4px 8px; font-size: var(--small); color: var(--bg); background: var(--accent);
    }
    /* The lightest palette color with soft bright shapes: the worst case for light text. */
    .demo-stage-bright {
      background:
        radial-gradient(circle at 75% 30%, var(--c15) 0 60px, transparent 61px),
        radial-gradient(circle at 20% 80%, var(--c7) 0 50px, transparent 51px),
        var(--c1);
    }
    /* A hard-edged checker in four contrasting palette colors: the busiest case. */
    .demo-stage-busy {
      background:
        repeating-linear-gradient(45deg, transparent 0 12px, var(--c10) 12px 16px),
        repeating-conic-gradient(var(--c1) 0 25%, var(--c2) 0 50%, var(--c12) 0 75%, var(--c15) 0 100%) 0 0 / 32px 32px;
    }
    .demo-stage .panel { position: absolute; top: 48px; left: 16px; width: 300px; margin: 0; font-size: var(--small); }
    .demo-stage .toast { top: 56px; left: auto; right: 16px; transform: none; font-size: var(--small); }
    .demo-stage .dialogue { left: 16px; right: 16px; bottom: 16px; padding: 16px; gap: 16px; font-size: var(--small); }
  </style>
</head>
<body>
  <!-- Open with Live Server (not by double-clicking). Shows every character happy and sad,
       plus a fallback test that must never throw (Amendment A10). Check F12 for errors.
       404s for PNGs nobody has drawn yet are expected. -->
  <div id="app"><div id="game"></div></div>
  <script type="module">
    import * as ui from './ui.js';

    const characterList = await (await fetch('./characters.json')).json();

    const root = ui.screen();
    root.classList.add('demo');
    root.insertAdjacentHTML('beforeend', `
      <h1>Portraits: happy and sad</h1>
      <div class="demo-note">Under each face: the file that actually showed. Fallback: mood file, then happy file, then placeholder.</div>
    `);
    const grid = document.createElement('div');
    grid.className = 'demo-grid';
    root.append(grid);

    // One face plus a label that reports where it came from once loading settles.
    function faceWithSource(characterId, mood, caption) {
      const face = document.createElement('div');
      face.className = 'demo-face';
      const sourceLabel = document.createElement('div');
      sourceLabel.className = 'demo-source';
      sourceLabel.textContent = `${caption}: loading...`;
      face.append(ui.portrait(characterId, 64, mood), sourceLabel);

      // The portrait sets data-source on load, or swaps itself for a placeholder box.
      // Stop watching once the label is written: writing it is itself a change in `face`,
      // and an observer that keeps reacting to its own edits freezes the page.
      const sourceWatcher = new MutationObserver(() => {
        const shown = face.querySelector('.portrait');
        if (!shown?.dataset.source) return;
        sourceWatcher.disconnect();
        sourceLabel.textContent = `${caption}: ${shown.dataset.source}`;
      });
      sourceWatcher.observe(face, { subtree: true, childList: true, attributes: true });
      return face;
    }

    function tile(title, faces, extraClass) {
      const box = document.createElement('div');
      box.className = `demo-tile ${extraClass ?? ''}`;
      box.textContent = title;
      const row = document.createElement('div');
      row.className = 'demo-faces';
      row.append(...faces);
      box.append(row);
      grid.append(box);
    }

    for (const character of characterList) {
      tile(character.name, [
        faceWithSource(character.id, 'happy', 'happy'),
        faceWithSource(character.id, 'sad', 'sad'),
      ]);
    }

    // Deliberately missing art: this id has no PNGs at all, so it must land on the placeholder
    // without an error. Also checks no mood (old style) and an unknown mood (warns, uses happy).
    tile('Fallback test (no art on purpose)', [
      faceWithSource('demo_missing', 'sad', 'sad'),
      faceWithSource('demo_missing', undefined, 'no mood'),
      faceWithSource('demo_missing', 'angry', 'bad mood'),
    ], 'demo-fallback');

    // Dialogue checks: old call style, opts.mood, ask() with a mood, and a data line from JSON.
    const buttonRow = document.createElement('div');
    buttonRow.className = 'demo-buttons';
    buttonRow.append(
      ui.button('say(), old style', () => ui.say('rosa', 'Measure twice, launch once.')),
      ui.button('say(), sad', () => ui.say('hal', "Engine's done for today. We try again tomorrow.", { mood: 'sad' })),
      ui.button('ask(), sad', async () => {
        const pickedIndex = await ui.ask('lucia', 'Breathe. Then decide. Do we try again?',
          [{ label: 'Try again' }, { label: 'Not yet' }], { mood: 'sad' });
        ui.toast(`Picked choice ${pickedIndex}`);
      }),
      ui.button('Data line', () => {
        const dataLine = { speaker: 'skye', text: 'Clouds rolled in. My mood is a bit overcast.', mood: 'sad' };
        ui.say(dataLine.speaker, dataLine.text, dataLine);
      }, { variant: 'quiet' }),
    );
    root.append(buttonRow);

    // See-through boxes: a panel, a toast and a dialogue box over a bright and a busy background.
    // Built as plain elements (not ui.say/ui.toast) so they stay on screen to look at.
    root.insertAdjacentHTML('beforeend', `
      <h1 style="margin-top: 32px">See-through text boxes</h1>
      <div class="demo-note">--panel-alpha 0.8, 2px blur on the dialogue box and panel, 1px dark text shadow.</div>
    `);
    const stages = document.createElement('div');
    stages.className = 'demo-stages';
    for (const [stageClass, stageLabel] of [['demo-stage-bright', 'Bright background'], ['demo-stage-busy', 'Busy background']]) {
      const stage = document.createElement('div');
      stage.className = `demo-stage ${stageClass}`;
      const label = document.createElement('div');
      label.className = 'demo-stage-label';
      label.textContent = stageLabel;

      const demoPanel = ui.panel('Panel title');
      demoPanel.insertAdjacentHTML('beforeend', '<p>Body text in a panel. <a href="#">A link</a>.</p>');
      demoPanel.append(ui.button('Button', () => {}), ui.bar(3, 5, 'Bar 3'));

      const demoToast = document.createElement('div');
      demoToast.className = 'toast';
      demoToast.textContent = 'Toast: Hal hired!';

      const demoDialogue = document.createElement('div');
      demoDialogue.className = 'dialogue';
      demoDialogue.innerHTML = '<div class="dialogue-body"><div class="dialogue-name">Rosa Vega</div>'
        + '<div class="dialogue-text">Measure twice, launch once. Can you read every word of this line?</div></div>';
      demoDialogue.prepend(ui.portrait('rosa', 64));

      stage.append(label, demoPanel, demoToast, demoDialogue);
      stages.append(stage);
    }
    root.append(stages);
  </script>
</body>
</html>
