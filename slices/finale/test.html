<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test: finale</title>
  <link rel="stylesheet" href="../../core/base.css">
</head>
<body>
  <!-- Open with Live Server. Examples (presets: RULEBOOK section 12):
         ?preset=launched&seed=123                 a real roll
         ?outcome=orbit                            force an ending: orbit, launch_failure, came_home_early,
                                                   bankrupt, window_closed, aliens (the secret ending, A6)
         ?outcome=orbit&report=1                   skip the launch and ending, open the mission report

       Launch animation previews (mix and match):
         &site=kodiak          canaveral, kodiak, kourou, mahia, sriharikota
         &rocket=pelican       sparrow, condor, condor_reflown, pelican
         &weather=storm        clear, rain, fog, wind, storm, cold
         ?outcome=orbit&emergency=life_support     a problem in orbit that the crew FIXES (or =power)
         ?outcome=came_home_early&cause=power      lights flicker, then go dark (or cause=life_support)
         ?outcome=launch_failure&cause=lightning   a storm, and the strike stops the launch

       No-launch endings (NOTES.md section 3). &endAt= is where the game stopped (default: trail):
         ?outcome=bankrupt&endAt=build             build never locked in        -> broke_build
         ?outcome=bankrupt&endAt=trail             money ran out on the trail   -> broke_trail
         ?outcome=bankrupt&endAt=launchweek        money ran out in launch week -> broke_launchweek
         ?outcome=bankrupt&endAt=giveup            Give up with money left      -> gave_up
         ?outcome=window_closed&endAt=trail        out of days on the trail     -> late_trail
         ?outcome=window_closed&endAt=launchweek   out of days in launch week   -> late_launchweek
         &lean=1         locked in with only $20M left (-> broke_build)
         &overrun=1      the cost_overrun flag (-> broke_overrun)
         &fundraised=1   the fundraised flag (-> broke_after_fundraise)
         &pr=1           a PR lead on staff (keeps Rosa's normal tip for broke_build and broke_trail)

       Also see sim-tests.html (automatic checks) and balance.html (5,000 launches). -->
  <div id="app"><div id="game"></div><div id="dashboard"></div></div>
  <script type="module">
    import { fakeState } from '../../core/state.js';
    import { show } from './finale.js';

    const params = new URLSearchParams(location.search);
    const outcome = params.get('outcome');
    const cause = params.get('cause');
    const emergency = params.get('emergency');
    // No-launch endings start from the preset closest to where the game stopped.
    const endAt = ['bankrupt', 'window_closed'].includes(outcome) ? (params.get('endAt') ?? 'trail') : null;
    const PRESET_FOR = { build: 'afterBuild', trail: 'midTrail', launchweek: 'readyToLaunch', giveup: 'readyToLaunch' };
    const presetName = params.get('preset') || (endAt ? PRESET_FOR[endAt] : outcome === 'aliens' ? 'secret' : 'launched');
    const state = fakeState(presetName);
    window.state = state; // type "state" in the browser console (F12) to inspect it

    // Preview a launch site, rocket or weather without playing the earlier slices.
    if (params.has('site')) state.site = params.get('site');
    if (params.has('rocket')) state.rocket = params.get('rocket');
    if (params.has('weather')) {
      const kind = params.get('weather');
      state.launchWeather = { ...(state.launchWeather ?? {}), kind, risk: kind === 'storm' ? 80 : 30 };
    }

    // Force an ending by rigging the dice. dice(0) passes every roll; dice(0.9999) fails the first one.
    // With several numbers, the rolls use them in order, then keep repeating the last one.
    const dice = (...values) => { let i = 0; return () => values[Math.min(i++, values.length - 1)]; };
    const opts = {};
    if (outcome) {
      // A clean flight unless you ask for trouble (the build's own numbers could add a random emergency).
      state.derived.emergencyChance = emergency === 'life_support' || emergency === '1' ? 0.25 : 0;
      state.derived.powerOk = emergency !== 'power';
    }
    if (outcome === 'orbit' || outcome === 'aliens') opts.rng = dice(0); // any emergency happens and gets fixed
    if (outcome === 'launch_failure') {
      if (cause === 'lightning') {
        // A storm: the strike hits (0), and the crew can't recover from it (0.99).
        state.launchWeather = { ...(state.launchWeather ?? {}), kind: 'storm', risk: 80 };
        opts.rng = dice(0, 0.99);
      } else {
        opts.rng = dice(0.9999);
      }
    }
    if (outcome === 'came_home_early') {
      if (cause === 'life_support') {
        // 4 stages pass (0), life support breaks (0 is under 0.25), the fix fails (0.99).
        state.derived.emergencyChance = 0.25;
        opts.rng = dice(0, 0, 0, 0, 0, 0.99);
      } else {
        // Power (the default): 0.8 passes every stage but fails the harder power fix.
        state.derived.powerOk = false;
        opts.rng = dice(0.8);
      }
    }
    if (endAt) {
      // Shape the state the way the real game would leave it (see endReason in launch-sim.js).
      state.outcome = endAt === 'giveup' ? 'bankrupt' : outcome; // launchweek.js saves Give up as bankrupt
      if (endAt === 'build') delete state.checkpoints.afterBuild; // Lock In never happened
      if (endAt === 'launchweek' || endAt === 'giveup') {
        state.weather = {}; // launchweek.js makes the forecast on its first day. Empty is enough here
        state.scrubs = 1;
        state.day = state.windowOpens + 2;
      }
      if (endAt === 'giveup') state.budget = 30;                        // money left: only Give up ends like this
      else if (state.outcome === 'bankrupt') state.budget = endAt === 'build' ? 0 : -5; // out of money
      else state.day = state.windowCloses + 1;                          // out of days
      if (params.has('lean') && state.checkpoints.afterBuild) state.checkpoints.afterBuild.budget = 20;
      if (params.has('overrun')) state.flags.push('cost_overrun');
      if (params.has('fundraised')) state.flags.push('fundraised');
      if (params.has('pr')) state.staff.push({ id: 'tasha', name: 'Tasha Brooks', role: 'pr', title: 'PR Lead', skill: 4, cost: 25, portrait: 'tasha' });
    }
    if (params.has('report')) opts.reportOnly = true; // ?report=1 jumps straight to the mission report

    show(state, (next, extra) => {
      console.log('done() called. Next:', next ?? 'the following slice', extra ?? '', state);
      document.getElementById('game').insertAdjacentHTML('beforeend',
        `<div class="toast">done('${next ?? ''}') called. See the console (F12). Reload to play again.</div>`);
    }, opts);
  </script>
</body>
</html>
