<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test: briefing</title>
  <link rel="stylesheet" href="../../core/base.css">
</head>
<body>
  <!-- Open with Live Server. Try ?preset=fresh&seed=123 (presets: RULEBOOK section 12).
       Add &resume=hiring to test Try Again, e.g. ?preset=afterHiring&resume=hiring -->
  <div id="app"><div id="game"></div><div id="dashboard"></div></div>
  <script type="module">
    import { fakeState } from '../../core/state.js';
    import * as ui from '../../core/ui.js';
    import { mountDashboard } from '../../core/dashboard.js';
    import { show } from './briefing.js';

    const params = new URLSearchParams(location.search);
    const state = fakeState(params.get('preset') || 'fresh');
    if (params.get('resume')) state.resume = params.get('resume');
    window.state = state; // type "state" in the browser console (F12) to inspect it

    // Same setup the real game does in core/screens.js, so ui.refresh() updates the dashboard here too.
    mountDashboard(document.getElementById('dashboard'));
    ui.bindState(state);
    ui.refresh();

    show(state, (next) => {
      console.log('done() called. Next:', next ?? 'the following slice', state);
      const finishedPanel = ui.screen();
      finishedPanel.append(ui.panel('Slice finished. See the console (F12) for the final state.'));
    });
  </script>
</body>
</html>
